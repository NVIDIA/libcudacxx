on:
  pull_request:
    branches:
    - main
    
permissions:
  contents: read
  pull-requests: read
  
# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
  
  
jobs:
  Lit-NoExecutor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@master
      - uses: microsoft/setup-msbuild@v1.0.2
        with:
          vs-version: 'latest'

      - name: Install CTK
        run: .github\action-scripts\fetch-cuda.ps1
        shell: powershell
      - name: Install Ninja
        run: .github\action-scripts\fetch-ninja.ps1
        shell: powershell
      - name: Install Lit
        run: py -m pip install wheel; py -m pip install lit
        shell: powershell

      - name: Configure CMake project
        run: |
          echo "$CUDA_PATH"
          cmake -S ./ -B ../build -DLIBCUDACXX_ENABLE_LIBCUDACXX_TESTS=ON -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_CUDA_COMPILER=nvcc -G Ninja
          lit -sv .upstream-tests/test -Dcompute_archs="70 80 90" -Dexecutor="NoopExecutor()" -Dstd=c++20
        shell: powershell
