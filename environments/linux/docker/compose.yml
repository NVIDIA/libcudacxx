## Baseline images ##
services:
  ubuntu22.04:
    image: "local/cccl-ubuntu22.04"
    build:
      context: .
      dockerfile: ubuntu.base.Dockerfile
      target: devenv
      args: &ubuntu22-args
        ROOT_IMAGE: "nvcr.io/nvidia/cuda:11.7.1-devel-ubuntu22.04"
        COMPILERS: "g++-11 g++-12 clang-12 clang-13 clang-11 clang-14"
    deploy: &deploy-template
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ubuntu20.04:
    image: "local/cccl-ubuntu20.04"
    build:
      context: .
      dockerfile: ubuntu.base.Dockerfile
      target: devenv
      args: &ubuntu20-args
        ROOT_IMAGE: "nvcr.io/nvidia/cuda:11.7.1-devel-ubuntu20.04"
        COMPILERS: "g++-10 g++-9 g++-8 clang-9 clang-8 clang-10"
    deploy: *deploy-template

  ubuntu18.04:
    image: "local/cccl-ubuntu18.04"
    build:
      context: .
      dockerfile: ubuntu.base.Dockerfile
      target: devenv
      args: &ubuntu18-args
        ROOT_IMAGE: "nvcr.io/nvidia/cuda:11.7.1-devel-ubuntu18.04"
        COMPILERS: "g++-5 g++-7 g++-6 clang-7"
    deploy: *deploy-template

  nvhpc-ubuntu22.04:
    image: "local/cccl-nvhpc-ubuntu22.04"
    build:
      context: .
      dockerfile: ubuntu.base.Dockerfile
      target: devenv
      args:
        ROOT_IMAGE: "nvcr.io/nvidia/nvhpc:22.7-devel-cuda11.7-ubuntu22.04"
    deploy: *deploy-template

## Configured images ##
### Ubuntu 22.04 images:

  gcc-11:
    image: "local/cccl-ubuntu22.04"
    container_name: gcc-11
    profiles: ["gcc-11"]
    build:
      context: ../../../
      target: libcudacxx-configured
      args:
        <<: *ubuntu22-args
        HOST_CXX: "g++-11"
    deploy: *deploy-template

  gcc-12:
    image: "local/cccl-ubuntu22.04"
    container_name: gcc-12
    profiles: ["gcc-12"]
    build:
